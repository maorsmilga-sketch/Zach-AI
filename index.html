<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ArcWiz AI – Next Gen Interface</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --glass-bg: rgba(30, 41, 59, 0.4); 
      --glass-border: rgba(255, 255, 255, 0.2);
      --glass-highlight: rgba(255, 255, 255, 0.05);
      --glass-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      --primary: #00f2ff; 
      --secondary: #7000ff; 
      --accent: #ff0055; 
      --text-main: #ffffff;
      --text-muted: #cbd5e1;
    }

    body {
      margin: 0; background: #0f172a; 
      font-family: 'Outfit', sans-serif; color: var(--text-main);
      min-height: 100vh; overflow-x: hidden; font-size: 16px; 
    }

    /* --- DYNAMIC BACKGROUND --- */
    .bg-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; }
    .bg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; }
    .layer-right { background-image: url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=2070&auto=format&fit=crop'); z-index: 1; }
    .layer-right::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(255,0,100,0.6), rgba(255,100,0,0.6)); mix-blend-mode: overlay; }
    .layer-left { background-image: url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=2070&auto=format&fit=crop'); z-index: 2; clip-path: inset(0 50% 0 0); border-right: 1px solid rgba(255,255,255,0.4); }
    .layer-left::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(0,200,255,0.6), rgba(100,50,255,0.6)); mix-blend-mode: overlay; }

    /* --- APP CONTAINER --- */
    .app { max-width: 1300px; margin: 0 auto; padding: 40px 24px; position: relative; z-index: 10; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
    .logo { font-size: 2.2rem; font-weight: 800; color: white; display: flex; align-items: center; gap: 15px; text-shadow: 0 4px 20px rgba(0,242,255,0.3); }
    .logo-icon { width: 48px; height: 48px; background: linear-gradient(135deg, #00c6ff, #0072ff); border-radius: 14px; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.5rem; box-shadow: 0 0 20px rgba(0,114,255,0.4); }

    /* --- GLASS CARDS --- */
    .glass-card { background: var(--glass-bg); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid var(--glass-border); border-top: 1px solid rgba(255,255,255,0.4); border-radius: 24px; padding: 32px; box-shadow: var(--glass-shadow); margin-bottom: 32px; transition: transform 0.3s ease; }
    h2 { margin-top: 0; font-size: 1.6rem; font-weight: 700; color: white; margin-bottom: 15px; }

    /* --- UPLOAD ZONE --- */
    .upload-container { background: rgba(0,0,0,0.2); border: 2px dashed rgba(255,255,255,0.2); border-radius: 20px; padding: 40px; text-align: center; }
    .upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 20px; }
    .file-input-wrapper { position: relative; cursor: pointer; height: 100%; }
    .file-input-wrapper input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 2; }
    .upload-btn-visual { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); padding: 25px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: white; font-weight: 600; min-height: 120px; }
    .file-name-display { font-size: 0.9rem; color: #4ade80; font-weight: 500; min-height: 1.2em; }

    /* --- BUTTONS --- */
    .btn-grad { background-image: linear-gradient(to right, #00c6ff 0%, #0072ff 100%); padding: 16px 50px; border-radius: 50px; border: none; font-weight: 700; font-size: 1.1rem; color: white; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4); transition: 0.3s; min-width: 220px; }
    .btn-grad:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0, 114, 255, 0.6); }

    /* --- CANVAS & 3D FIX --- */
    .main-grid { display: grid; grid-template-columns: 2.5fr 1fr; gap: 32px; }
    @media(max-width: 1000px) { .main-grid { grid-template-columns: 1fr; } }

    .canvas-container { position: relative; background: rgba(10, 10, 15, 0.6); border-radius: 16px; aspect-ratio: 16/9; overflow: hidden; border: 1px solid rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 100px rgba(0,0,0,0.5); }
    
    /* 3D View: נטרול הזום המובנה ושימוש ב-Contain */
    #layer3D img, #layer3D video { width: 100%; height: 100%; object-fit: contain; }

    #zoomWrapper { width: 100%; height: 100%; position: absolute; transform-origin: center center; transition: transform 0.1s linear; display: flex; align-items: center; justify-content: center; }
    #zoomWrapper img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }

    /* --- MARKERS --- */
    .marker { position: absolute; width: 32px; height: 32px; border-radius: 50%; background: #ff0055; border: 3px solid white; display: none; align-items: center; justify-content: center; cursor: pointer; transform: scale(0); transition: 0.3s; z-index: 10; color: white; font-weight: 800; box-shadow: 0 5px 15px rgba(255, 0, 85, 0.6); }

    /* --- SCANNER --- */
    .scan-line { position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, transparent, #00f2ff, transparent); box-shadow: 0 0 30px #00f2ff, 0 0 10px white; z-index: 20; display: none; opacity: 0.9; }
    .scanning .scan-line { display: block; animation: scanMove 1.2s infinite alternate ease-in-out; }
    @keyframes scanMove { 0% { top: 0%; opacity: 0.5; } 100% { top: 100%; opacity: 1; } }

    /* --- MINI PLAY BUTTON (New Style) --- */
    .mini-play-btn {
        position: absolute; bottom: 20px; right: 20px; z-index: 30;
        background: var(--glass-bg); backdrop-filter: blur(10px);
        border: 1px solid var(--glass-border); color: white;
        padding: 10px 20px; border-radius: 50px; cursor: pointer;
        display: flex; align-items: center; gap: 10px; font-weight: 600;
        transition: 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .mini-play-btn:hover { background: white; color: black; transform: scale(1.05); }
    .mini-play-btn i { font-size: 1.2rem; }

    .close-video-btn { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.6); color: white; border: 1px solid rgba(255,255,255,0.3); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; z-index: 40; display: flex; align-items: center; justify-content: center; }

    /* --- SIDEBAR & CHAT --- */
    .sidebar-title { font-size: 1.3rem; margin-bottom: 24px; color: white; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.15); padding-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .info-row { display: flex; justify-content: space-between; margin-bottom: 18px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .info-val { font-weight: 600; color: white; }
    .issue-card { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 18px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; }
    .reg-link { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; color: var(--primary); font-size: 0.8rem; text-decoration: none; font-weight: 600; }
    .chat-section { margin-top: 24px; display: flex; flex-direction: column; gap: 12px; height: 350px; }
    .chat-history { flex: 1; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
    .chat-bubble { max-width: 85%; padding: 14px 18px; border-radius: 18px; font-size: 1rem; }
    .chat-bubble.bot { align-self: flex-start; background: rgba(255,255,255,0.15); color: white; }
    .chat-bubble.user { align-self: flex-end; background: linear-gradient(135deg, #7000ff, #ae00ff); color: white; }

    /* --- TOGGLES --- */
    .view-toggles { display: flex; gap: 12px; margin-bottom: 12px; }
    .toggle-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); padding: 10px 24px; border-radius: 12px; color: rgba(255,255,255,0.7); cursor: pointer; }
    .toggle-btn.active { background: white; color: #000; font-weight: 700; border-color: white; }
    .toggle-btn.disabled { opacity: 0.4; cursor: not-allowed; }

    .layer-controls { position: absolute; top: 20px; right: 20px; z-index: 20; background: rgba(0,0,0,0.6); border-radius: 50px; padding: 5px; display: flex; gap: 5px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
    .layer-btn { border: none; background: transparent; padding: 8px 20px; border-radius: 50px; cursor: pointer; font-weight: 600; font-size: 0.8rem; color: #ccc; }
    .layer-btn.active { background: var(--primary); color: #000; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px); z-index: 9999; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    .modal-overlay.active { opacity: 1; pointer-events: all; }
    .modal-content { background: rgba(20, 25, 40, 0.95); border: 1px solid rgba(255,255,255,0.2); padding: 40px; border-radius: 24px; width: 360px; text-align: center; color: white; }
    .modal-btn { background: white; color: #7000ff; border: none; padding: 12px 30px; border-radius: 50px; font-weight: 700; cursor: pointer; margin-top: 25px; }

    .zoom-controls { position: absolute; bottom: 20px; right: 20px; z-index: 50; display: flex; flex-direction: column; gap: 8px; }
    .zoom-btn { background: rgba(255,255,255,0.9); border: none; width: 40px; height: 40px; border-radius: 12px; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>

<div class="bg-container">
  <div class="bg-layer layer-right"></div>
  <div class="bg-layer layer-left" id="dynamicBg"></div>
</div>

<div class="app">
  <header>
    <div class="logo"><div class="logo-icon">▲</div>ArcWiz AI</div>
  </header>

  <div class="glass-card">
    <h2>Upload Project Files</h2>
    <div class="upload-container">
      <p style="color:var(--text-muted); margin-bottom:20px; font-size:1.1rem;">Drag & drop files here or <u>Browse Files</u></p>
      <div class="upload-grid">
        <label class="file-input-wrapper">
          <input type="file" id="archInput" accept="image/*">
          <div class="upload-btn-visual"><span>📐 Upload Floor Plan</span><span id="archFileName" class="file-name-display"></span></div>
        </label>
        <label class="file-input-wrapper">
          <input type="file" id="mepInput" accept="image/*">
          <div class="upload-btn-visual"><span>⚡ Upload MEP Plan</span><span id="mepFileName" class="file-name-display"></span></div>
        </label>
      </div>
    </div>
    <div style="text-align:center; margin-top: 20px;">
       <button class="btn-grad" id="analyzeBtn"><span>✨ Run Analysis</span></button>
    </div>
  </div>

  <div class="main-grid">
    <div class="glass-card" style="display:flex; flex-direction:column; min-height:650px;">
      <div class="view-toggles">
         <button class="toggle-btn active" id="btn2D">Floor Plan</button>
         <button class="toggle-btn disabled" id="btn3D">3D Model</button>
      </div>

      <div class="canvas-container" id="mainCanvasContainer" style="flex:1; min-height: 400px;">
        <div id="layer2D" class="view-layer">
            <div class="zoom-controls"><button class="zoom-btn" onclick="zoomIn()">+</button><button class="zoom-btn" onclick="zoomOut()">-</button></div>
            <div id="layerSwitcher" class="layer-controls" style="display:none;"><button id="showArchBtn" class="layer-btn active">Arch</button><button id="showMepBtn" class="layer-btn">MEP</button></div>
            <div class="scan-line"></div> 
            <div class="placeholder-text">Waiting for plan upload...</div>
            <div id="zoomWrapper">
                <img id="currentArchImg" style="display:none;">
                <img id="currentMepImg" style="display:none;">
                <div id="marker1" class="marker" style="top: 30%; left: 24%;">1</div>
                <div id="marker2" class="marker" style="top: 37%; right: 33%;">2</div>
            </div>
        </div>

        <div id="layer3D" class="view-layer" style="display:none;">
            <div id="image3DContainer" style="width:100%; height:100%; position:relative;">
                <img src="3d model.jpg" alt="3D Model" onerror="this.src='https://via.placeholder.com/800x600/1e293b/ffffff?text=3D+Model+Preview'">
                <button id="btnPlayVideo" class="mini-play-btn"><span>▶ Run Simulation</span></button>
            </div>
            <div id="videoContainer" style="display:none; width:100%; height:100%; position:relative;">
                <button id="btnCloseVideo" class="close-video-btn">✕</button>
                <video id="video3D" controls style="width:100%; height:100%; object-fit:contain;"><source src="3d video.mp4" type="video/mp4"></video>
            </div>
        </div>
      </div>
      
      <div class="chat-history" id="chatHistory" style="margin-top: 20px;"><div class="chat-bubble bot">Hello! Upload blueprints to begin.</div></div>
    </div>

    <div class="glass-card">
      <div class="sidebar-title">Summary <span class="badge-ai" id="aiStatus" style="display:none; background:#4ade80; color:black; padding:4px 8px; border-radius:8px;">DONE</span></div>
      <div class="info-row"><span>Area</span><span id="areaDisplay">--</span></div>
      <div class="info-row"><span>Rooms</span><span>3</span></div>
      <div id="issuesList" style="display:none; margin-top:20px;">
        <div class="issue-card" data-target="marker1"><div style="color:#ef4444; font-weight:700;">⚠️ Socket too close to sink</div><a href="https://www.gov.il/he/pages/mmok_takanot_maagar_2025" target="_blank" class="reg-link">📜 View Code</a></div>
        <div class="issue-card" data-target="marker2"><div style="color:#fbbf24; font-weight:700;">⚠️ Switch in wet zone</div><a href="https://www.gov.il/he/Departments/legalInfo/electricity_regulations_bathrooms" target="_blank" class="reg-link">📜 View Code</a></div>
      </div>
    </div>
  </div>
</div>

<div id="customModal" class="modal-overlay"><div class="modal-content"><div style="font-size:3rem;">⚠️</div><div id="modalMessage" style="margin:20px 0;"></div><button id="closeModalBtn" class="modal-btn">Understood</button></div></div>

<script>
  let scale = 1, pointX = 0, pointY = 0, isDragging = false, startX, startY;
  const zoomWrapper = document.getElementById('zoomWrapper'), canvas = document.getElementById('mainCanvasContainer');
  function updateTransform() { zoomWrapper.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`; }

  canvas.addEventListener('wheel', (e) => { if(document.getElementById('layer2D').style.display==='none') return; e.preventDefault(); scale = Math.min(Math.max(1, scale + (-Math.sign(e.deltaY) * 0.1)), 5); if(scale===1){pointX=0;pointY=0;} updateTransform(); });
  canvas.addEventListener('mousedown', (e) => { if (scale > 1) { isDragging = true; startX = e.clientX - pointX; startY = e.clientY - pointY; canvas.style.cursor = 'grabbing'; } });
  window.addEventListener('mousemove', (e) => { if (isDragging) { pointX = e.clientX - startX; pointY = e.clientY - startY; updateTransform(); } });
  window.addEventListener('mouseup', () => { isDragging = false; canvas.style.cursor = 'grab'; });

  function zoomIn() { scale = Math.min(5, scale + 0.5); updateTransform(); }
  function zoomOut() { scale = Math.max(1, scale - 0.5); if(scale===1){pointX=0;pointY=0;} updateTransform(); }

  const archInput = document.getElementById('archInput'), mepInput = document.getElementById('mepInput');
  const analyzeBtn = document.getElementById('analyzeBtn');

  analyzeBtn.addEventListener('click', () => {
    if (archInput.files.length === 0) { showCustomAlert("Please upload a Floor Plan!"); return; }
    document.getElementById('layer2D').classList.add('scanning');
    analyzeBtn.innerHTML = "<span>🧠 Analyzing...</span>";
    setTimeout(() => analyzeBtn.innerHTML = "<span>🔍 Detecting Clashes...</span>", 2500);
    setTimeout(() => {
      document.getElementById('layer2D').classList.remove('scanning');
      analyzeBtn.innerHTML = "<span>✨ Analysis Complete</span>";
      analyzeBtn.style.background = "linear-gradient(to right, #4ade80, #22c55e)";
      document.getElementById('aiStatus').style.display = 'inline-block';
      document.getElementById('issuesList').style.display = 'block';
      document.querySelectorAll('.marker').forEach(m => { m.style.display = 'flex'; setTimeout(() => m.style.transform = "scale(1)", 50); });
      document.getElementById('areaDisplay').innerText = "~88 sqm";
    }, 6000);
  });

  function handleUpload(input, nameId, imgId) {
    input.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        document.getElementById(nameId).textContent = "✅ " + file.name;
        if(input.id === 'archInput') document.getElementById('btn3D').classList.remove('disabled');
        const reader = new FileReader();
        reader.onload = (evt) => {
          document.querySelector('.placeholder-text').style.display = 'none';
          document.getElementById('layerSwitcher').style.display = 'flex';
          const img = document.getElementById(imgId); img.src = evt.target.result; img.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    });
  }
  handleUpload(archInput, 'archFileName', 'currentArchImg');
  handleUpload(mepInput, 'mepFileName', 'currentMepImg');

  function showCustomAlert(msg) { document.getElementById('modalMessage').innerText = msg; document.getElementById('customModal').classList.add('active'); }
  document.getElementById('closeModalBtn').addEventListener('click', () => document.getElementById('customModal').classList.remove('active'));

  // 3D View Handlers
  document.getElementById('btn3D').addEventListener('click', () => {
    if(archInput.files.length === 0) return;
    document.getElementById('btn3D').classList.add('active');
    document.getElementById('btn2D').classList.remove('active');
    document.getElementById('layer2D').style.display = 'none';
    document.getElementById('layer3D').style.display = 'flex';
    // Always show image first, reset video
    document.getElementById('image3DContainer').style.display = 'block';
    document.getElementById('videoContainer').style.display = 'none';
    const v = document.getElementById('video3D'); v.pause(); v.currentTime = 0;
  });

  document.getElementById('btn2D').addEventListener('click', () => {
    document.getElementById('btn2D').classList.add('active');
    document.getElementById('btn3D').classList.remove('active');
    document.getElementById('layer2D').style.display = 'flex';
    document.getElementById('layer3D').style.display = 'none';
  });

  document.getElementById('btnPlayVideo').addEventListener('click', () => {
    document.getElementById('image3DContainer').style.display = 'none';
    document.getElementById('videoContainer').style.display = 'block';
    document.getElementById('video3D').play();
  });

  document.getElementById('btnCloseVideo').addEventListener('click', () => {
    const v = document.getElementById('video3D'); v.pause();
    document.getElementById('videoContainer').style.display = 'none';
    document.getElementById('image3DContainer').style.display = 'block';
  });

  document.getElementById('showArchBtn').addEventListener('click', () => { document.getElementById('showArchBtn').classList.add('active'); document.getElementById('showMepBtn').classList.remove('active'); document.getElementById('currentArchImg').style.display = 'block'; document.getElementById('currentMepImg').style.display = 'none'; });
  document.getElementById('showMepBtn').addEventListener('click', () => { document.getElementById('showMepBtn').classList.add('active'); document.getElementById('showArchBtn').classList.remove('active'); document.getElementById('currentMepImg').style.display = 'block'; document.getElementById('currentArchImg').style.display = 'none'; });
</script>
</body>
</html>
