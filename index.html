<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title> האחים היקרים - בוקרשט ✈️🇷🇴</title>

  <style>
    :root{
      --gold:#d4af37;
      --fg:#ffffff;
      --fg-muted:#dddddd;
      --glass:rgba(255,255,255,0.1);
      --blur:6px;
      --accent-red:#f44336;
      --accent-yellow:#f1c40f;
      --accent-green:#2ecc71;
    }

    body{
      margin:0;
      font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color:var(--fg);
      text-align:center;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
        url('https://images.unsplash.com/photo-1534351590666-13e3e96b5017?q=80&w=1920&auto=format&fit=crop')
        center/cover fixed;
    }

    .container{
      background-color: rgba(0,0,0,0.75);
      border:2px solid var(--gold);
      border-radius:16px;
      box-shadow:0 0 30px rgba(0,0,0,0.5);
      padding:32px;
      width:min(980px, calc(100% - 24px));
      margin: 20px 0;
    }

    h1{ margin:0 0 10px; color:var(--gold); font-size:2.3rem; text-transform:uppercase; letter-spacing:2px; }
    
    /* ===== רשימת משתתפים ===== */
    .people-section {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-bottom: 25px;
      background: var(--glass);
      padding: 15px;
      border-radius: 12px;
      border: 1px solid rgba(212,175,55,0.3);
    }
    .people-group { text-align: right; }
    .people-group h3 { margin: 0 0 8px; font-size: 1rem; color: var(--gold); border-bottom: 1px solid var(--gold); }
    .people-group ul { list-style: none; padding: 0; margin: 0; display: flex; gap: 10px; flex-wrap: wrap; }
    .people-group li { font-size: 0.95rem; background: rgba(255,255,255,0.1); padding: 2px 10px; border-radius: 5px; }

    /* ===== ספירה לאחור ===== */
    #countdown{ display:flex; justify-content:center; gap:15px; flex-wrap:wrap; margin-top:12px; }
    .time-box{
      background:var(--glass);
      padding:14px; border-radius:12px; min-width:85px;
      backdrop-filter: blur(var(--blur));
      border: 1px solid rgba(255,255,255,0.1);
    }
    .number{ display:block; font-size:2.5rem; font-weight:bold; color: var(--gold); }
    .label { font-size:0.9rem; color:var(--fg-muted); }

    /* ===== בר התקדמות צבעוני ===== */
    .days-progress{ margin-top:24px; text-align:right; }
    .days-header{ display:flex; justify-content:space-between; align-items:center; color:var(--fg-muted); font-size:0.95rem; }
    .days-bar{
      margin-top:10px; height:24px; width:100%; display:flex;
      border-radius:12px; overflow:hidden;
      background: rgba(255,255,255,0.1);
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.05);
    }
    .days-bar .seg{ flex:1 1 auto; transition: background 0.5s ease; border-left: 1px solid rgba(0,0,0,0.2); }
    
    /* צבעים לפי בקשתך */
    .seg.filled-start  { background: linear-gradient(180deg, #e74c3c, var(--accent-red)); }
    .seg.filled-middle { background: linear-gradient(180deg, #f39c12, var(--accent-yellow)); }
    .seg.filled-end    { background: linear-gradient(180deg, #27ae60, var(--accent-green)); }
    .seg.empty { background: transparent; }

    .btn{ border:1px solid var(--gold); background:transparent; color:var(--fg); padding:10px 20px; border-radius:8px; cursor:pointer; margin: 10px; font-weight: bold; }
    .btn:hover{ background:var(--gold); color: black; }
  </style>
</head>
<body>

  <div class="container">
    <h1>האחים היקרים טסים לבוקרשט! 🇷🇴</h1>
    
    <div class="people-section">
        <div class="people-group">
            <h3>משתתפים</h3>
            <ul>
                <li>✅ היצ'קוק</li>
                <li>✅ בגדן</li>
                <li>✅ עידו</li>
                <li>✅ מאור</li>
            </ul>
        </div>
        <div class="people-group">
            <h3>מתלבטים</h3>
            <ul style="opacity: 0.7;">
                <li>❓ ניר</li>
                <li>❓ בילי</li>
            </ul>
        </div>
    </div>

    <div id="countdown">
      <div class="time-box"><span class="number" id="days">00</span><span class="label">ימים</span></div>
      <div class="time-box"><span class="number" id="hours">00</span><span class="label">שעות</span></div>
      <div class="time-box"><span class="number" id="minutes">00</span><span class="label">דקות</span></div>
      <div class="time-box"><span class="number" id="seconds">00</span><span class="label">שניות</span></div>
    </div>

    <div class="days-progress">
      <div class="days-header">
        <span id="daysSummary">מחשב התקדמות...</span>
        <span id="daysCounters"></span>
      </div>
      <div class="days-bar" id="daysBar"></div>
    </div>

    <div class="actions" style="margin-top: 30px;">
      <button class="btn" id="share">🔗 שתף את האחים</button>
    </div>
  </div>

  <script>
    // הגדרות זמנים
    const TARGET_DATE = Date.UTC(2026, 1, 28, 7, 20); // 28.02.2026 09:20
    const START_DATE = new Date('2025-12-09T00:00:00').getTime(); // תחילת הספירה לבקשתך

    function updateApp() {
        const now = Date.now();
        const timeLeft = TARGET_DATE - now;

        if (timeLeft <= 0) {
            document.querySelector('.container').innerHTML = "<h1>יאללה לבוקרשט! ✈️🍻</h1>";
            return;
        }

        // 1. עדכון טיימר
        const d = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
        const h = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const m = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((timeLeft % (1000 * 60)) / 1000);

        document.getElementById('days').textContent = d;
        document.getElementById('hours').textContent = String(h).padStart(2, '0');
        document.getElementById('minutes').textContent = String(m).padStart(2, '0');
        document.getElementById('seconds').textContent = String(s).padStart(2, '0');

        // 2. עדכון בר התקדמות
        const totalDuration = TARGET_DATE - START_DATE;
        const elapsed = now - START_DATE;
        const percent = Math.min(Math.max((elapsed / totalDuration) * 100, 0), 100);

        const bar = document.getElementById('daysBar');
        bar.innerHTML = '';
        const totalSegments = 60; // כמות הקוביות בבר
        const filledSegments = Math.floor((percent / 100) * totalSegments);

        for (let i = 0; i < totalSegments; i++) {
            const seg = document.createElement('div');
            seg.className = 'seg';
            
            if (i < filledSegments) {
                // לוגיקת צבעים: אדום -> צהוב -> ירוק
                if (percent < 35) {
                    seg.classList.add('filled-start'); // אדום
                } else if (percent < 75) {
                    seg.classList.add('filled-middle'); // צהוב
                } else {
                    seg.classList.add('filled-end'); // ירוק
                }
            } else {
                seg.classList.add('empty');
            }
            bar.appendChild(seg);
        }
        
        document.getElementById('daysSummary').textContent = `התקדמות: ${Math.floor(percent)}%`;
        const totalDays = Math.floor(totalDuration / (1000*60*60*24));
        const daysPassed = Math.floor(elapsed / (1000*60*60*24));
        document.getElementById('daysCounters').textContent = `עברו ${daysPassed} ימים מתוך ${totalDays}`;
    }

    setInterval(updateApp, 1000);
    updateApp();

    document.getElementById('share').onclick = () => {
        const text = `בוקרשט מחכה לנו! עוד ${document.getElementById('days').textContent} ימים למנאייק.`;
        if (navigator.share) {
            navigator.share({ title: 'בוקרשט 2026', text: text, url: window.location.href });
        } else {
            navigator.clipboard.writeText(window.location.href);
            alert("הלינק הועתק! שלח לחברים");
        }
    };
  </script>
</body>
</html>
