<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>בוקרשט 2026 - טיול האחים</title>
    <style>
        /* הגדרות עיצוב כלליות */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* רקע יוקרתי יותר שמתאים לקזינו/מלון */
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1596525737525-a130f162793b?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            text-align: center;
        }

        .container {
            background-color: rgba(20, 20, 20, 0.85);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid #d4af37; /* זהב */
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
            max-width: 800px;
            width: 90%;
        }

        h1 {
            font-size: 3rem;
            margin: 0 0 10px 0;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px #000;
        }

        .vibe {
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 20px;
            font-weight: 300;
        }

        .details {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 30px;
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 10px;
            display: inline-block;
        }

        .squad {
            margin: 30px 0;
            padding-top: 20px;
            border-top: 1px solid rgba(212, 175, 55, 0.3);
        }

        .squad h3 {
            color: #d4af37;
            margin-bottom: 15px;
        }

        .names {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .pending {
            font-size: 1rem;
            color: #ff6b6b; /* אדום עדין */
            font-style: italic;
        }

        /* עיצוב השעון */
        #countdown {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .time-box {
            background: linear-gradient(145deg, #1a1a1a, #333);
            padding: 15px 20px;
            border-radius: 12px;
            min-width: 70px;
            border: 1px solid #444;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .number {
            display: block;
            font-size: 2.5rem;
            font-weight: bold;
            color: #fff;
        }

        .label {
            font-size: 0.9rem;
            color: #d4af37;
            text-transform: uppercase;
        }

        /* התאמה למובייל */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .vibe { font-size: 1.1rem; }
            .number { font-size: 1.8rem; }
            .time-box { min-width: 50px; padding: 10px; }
            .names { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>האחים היקרים כובשים את בוקרשט! 🇷🇴</h1>
        <p class="vibe">ספא 🧖‍♂️ | קזינו 🎰 | אלכוהול 🥃 | חופש מהשגרה 🦅</p>
        
        <div class="details">
            📍 נפגשים בנתב"ג (טרמינל 3) <br>
            📅 28.02.2026 בשעה <strong>06:20</strong> <br>
            (מתחילים בדיוטי, ממריאים ב-09:20)
        </div>
        
        <div id="countdown">
            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">ימים</span>
            </div>
            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">שעות</span>
            </div>
            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">דקות</span>
            </div>
            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">שניות</span>
            </div>
        </div>

        <div class="squad">
            <h3>⭐ ההרכב הפותח ⭐</h3>
            <div class="names">
                היצ'קוק • בגדן • מאור • עידו
            </div>
            <div class="pending">
                ❓ בסימן שאלה (תתעוררו על עצמכם): ניר ובילי
            </div>
        </div>
    </div>

    <script>
        // הגדרת תאריך היעד: 28 בפברואר 2026, שעה 06:20 (זמן המפגש)
        const targetDate = new Date("Feb 28, 2026 06:20:00").getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            // חישובי זמן לימים, שעות, דקות ושניות
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // עדכון ה-HTML
            document.getElementById("days").innerHTML = days;
            document.getElementById("hours").innerHTML = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerHTML = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerHTML = seconds < 10 ? "0" + seconds : seconds;

            // כשהזמן נגמר
            if (distance < 0) {
                clearInterval(timer);
                document.getElementById("countdown").innerHTML = "<h2>🥂 יאללה לדיוטי! נפגשים עכשיו! 🥂</h2>";
            }
        }, 1000);
    </script>

</body>
</html>
