<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הספירה לאחור לבוקרשט!</title>
    <style>
        /* הגדרות עיצוב כלליות */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1534351590666-13e3e96b5017?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            text-align: center;
        }

        .container {
            background-color: rgba(0, 0, 0, 0.6);
            padding: 40px;
            border-radius: 15px;
            border: 2px solid #d4af37; /* צבע זהב */
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #ddd;
        }

        /* עיצוב השעון */
        #countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            min-width: 80px;
            backdrop-filter: blur(5px);
        }

        .number {
            display: block;
            font-size: 3rem;
            font-weight: bold;
            color: #fff;
        }

        .label {
            font-size: 1rem;
            color: #d4af37;
        }

        /* התאמה למובייל */
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .number { font-size: 2rem; }
            .time-box { min-width: 60px; padding: 10px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>האחים היקרים טסים לבוקרשט! 🇷🇴</h1>
        <p>נפגשים במריוט ב-28.02.2026 בשעה 09:20</p>
        
        <div id="countdown">
            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">ימים</span>
            </div>
            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">שעות</span>
            </div>
            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">דקות</span>
            </div>
            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">שניות</span>
            </div>
        </div>
    </div>

    <script>
        // הגדרת תאריך היעד: 28 בפברואר 2026, שעה 09:20
        const targetDate = new Date("Feb 28, 2026 09:20:00").getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            // חישובי זמן לימים, שעות, דקות ושניות
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // עדכון ה-HTML
            document.getElementById("days").innerHTML = days;
            document.getElementById("hours").innerHTML = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerHTML = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerHTML = seconds < 10 ? "0" + seconds : seconds;

            // כשהזמן נגמר
            if (distance < 0) {
                clearInterval(timer);
                document.getElementById("countdown").innerHTML = "<h2>הגיע הזמן לטוס! ✈️</h2>";
            }
        }, 1000);
    </script>

</body>
</html>
