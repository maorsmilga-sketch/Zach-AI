<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>בוקרשט 2026 - טיול האחים</title>
    <style>
        /* הגדרות עיצוב כלליות */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('https://images.unsplash.com/photo-1596525737525-a130f162793b?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            text-align: center;
        }

        .container {
            background-color: rgba(20, 20, 20, 0.9);
            padding: 30px;
            border-radius: 20px;
            border: 2px solid #d4af37; /* זהב */
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.3);
            max-width: 800px;
            width: 90%;
            margin: 20px;
        }

        h1 {
            font-size: 2.8rem;
            margin: 0 0 10px 0;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px #000;
        }

        .vibe {
            font-size: 1.3rem;
            color: #fff;
            margin-bottom: 25px;
            font-weight: 300;
        }

        /* עיצוב כרטיס הטיסה */
        .flight-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: right;
        }

        .flight-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .flight-row:last-child {
            border-bottom: none;
        }

        .flight-icon { font-size: 1.5rem; margin-left: 10px; }
        .flight-date { color: #d4af37; font-weight: bold; }
        .flight-time { font-family: monospace; font-size: 1.1rem; }
        .flight-num { font-size: 0.9rem; color: #aaa; }

        /* עיצוב השעון */
        #countdown {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 30px 0;
        }

        .time-box {
            background: linear-gradient(145deg, #1a1a1a, #333);
            padding: 15px 20px;
            border-radius: 12px;
            min-width: 70px;
            border: 1px solid #444;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .number {
            display: block;
            font-size: 2.5rem;
            font-weight: bold;
            color: #fff;
        }

        .label {
            font-size: 0.9rem;
            color: #d4af37;
            text-transform: uppercase;
        }

        /* רשימת המשתתפים */
        .squad {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(212, 175, 55, 0.3);
        }

        .squad h3 { color: #d4af37; margin-bottom: 15px; }

        .names {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .pending {
            font-size: 1rem;
            color: #ffcc00;
            font-style: italic;
        }

        .meeting-point {
            background-color: #d4af37;
            color: #000;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 20px;
            display: inline-block;
        }

        /* התאמה למובייל */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .flight-row { flex-direction: column; align-items: flex-start; gap: 5px; }
            .number { font-size: 1.8rem; }
            .time-box { min-width: 50px; padding: 10px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>האחים כובשים את בוקרשט 🇷🇴</h1>
        <p class="vibe">ספא 🧖‍♂️ | קזינו 🎰 | אלכוהול 🥃 | חופש 🦅</p>
        
        <div class="flight-card">
            <div class="flight-row">
                <div>
                    <span class="flight-icon">🛫</span>
                    <span class="flight-date">הלוך: יום ד' 25.02</span>
                </div>
                <div>
                    <span class="flight-time">09:20 TLV ➔ 12:15 OTP</span>
                    <span class="flight-num">(W4 3258)</span>
                </div>
            </div>
            <div class="flight-row">
                <div>
                    <span class="flight-icon">🛬</span>
                    <span class="flight-date">חזור: יום א' 01.03</span>
                </div>
                <div>
                    <span class="flight-time">11:15 OTP ➔ 13:55 TLV</span>
                    <span class="flight-num">(W4 3263)</span>
                </div>
            </div>
        </div>

        <div class="meeting-point">
            📍 נפגשים בנתב"ג בשעה 06:20 בול!
        </div>
        
        <div id="countdown">
            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">ימים</span>
            </div>
            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">שעות</span>
            </div>
            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">דקות</span>
            </div>
            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">שניות</span>
            </div>
        </div>

        <div class="squad">
            <h3>⭐ ההרכב המנצח ⭐</h3>
            <div class="names">
                היצ'קוק • בגדן • מאור • עידו
            </div>
            <div class="pending">
                ❓ מתנדנד: ניר
            </div>
        </div>
    </div>

    <script>
        // תאריך יעד: 25 בפברואר 2026, שעה 06:20 (זמן המפגש לטיסה של 09:20)
        const targetDate = new Date("Feb 25, 2026 06:20:00").getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerHTML = days;
            document.getElementById("hours").innerHTML = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerHTML = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerHTML = seconds < 10 ? "0" + seconds : seconds;

            if (distance < 0) {
                clearInterval(timer);
                document.getElementById("countdown").innerHTML = "<h2>🥂 יאללה לדיוטי! טסים! 🥂</h2>";
            }
        }, 1000);
    </script>

</body>
</html>
