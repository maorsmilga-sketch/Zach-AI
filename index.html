<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ArcWiz AI – Next Gen Interface</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <style>
    :root {
      --glass-bg: rgba(30, 41, 59, 0.4); 
      --glass-border: rgba(255, 255, 255, 0.2);
      --glass-highlight: rgba(255, 255, 255, 0.05);
      --glass-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      
      --primary: #00f2ff;
      --secondary: #7000ff;
      --accent: #ff0055;
      --warning: #fbbf24;
      
      --text-main: #ffffff;
      --text-muted: #cbd5e1;
    }

    body {
      margin: 0;
      background: #0f172a; 
      font-family: 'Outfit', sans-serif; 
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      font-size: 16px; 
    }

    .bg-container {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
    }
    .bg-layer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-size: cover; background-position: center;
    }
    .layer-right {
      background-image: url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=2070&auto=format&fit=crop');
      z-index: 1;
    }
    .layer-right::after {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, rgba(255,0,100,0.6), rgba(255,100,0,0.6));
      mix-blend-mode: overlay;
    }
    .layer-left {
      background-image: url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=2070&auto=format&fit=crop');
      z-index: 2;
      clip-path: inset(0 50% 0 0);
      border-right: 1px solid rgba(255,255,255,0.4);
    }
    .layer-left::after {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, rgba(0,200,255,0.6), rgba(100,50,255,0.6));
      mix-blend-mode: overlay;
    }

    .app {
      max-width: 1300px; 
      margin: 0 auto;
      padding: 40px 24px;
      position: relative;
      z-index: 10;
    }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
    .logo {
      font-size: 2.2rem; font-weight: 800; color: white;
      display: flex; align-items: center; gap: 15px;
      text-shadow: 0 4px 20px rgba(0,242,255,0.3); letter-spacing: -0.5px;
    }
    .logo-icon {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      border-radius: 14px; display: flex; align-items: center; justify-content: center;
      color: white; font-size: 1.5rem; box-shadow: 0 0 20px rgba(0,114,255,0.4);
    }

    .glass-card {
      background: var(--glass-bg); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--glass-border); border-top: 1px solid rgba(255,255,255,0.4); 
      border-radius: 24px; padding: 32px; box-shadow: var(--glass-shadow); margin-bottom: 32px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 20px; }
    .file-input-wrapper { position: relative; cursor: pointer; }
    .file-input-wrapper input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 2; }
    .upload-btn-visual {
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1);
      padding: 25px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 12px;
      color: white; font-weight: 600; transition: 0.2s;
    }
    .file-input-wrapper:hover .upload-btn-visual { background: rgba(255,255,255,0.15); transform: translateY(-4px); }

    .btn-grad {
      background-image: linear-gradient(to right, #00c6ff 0%, #0072ff 100%);
      padding: 16px 50px; border-radius: 50px; border: none;
      font-weight: 700; color: white; cursor: pointer; transition: 0.3s;
      display: inline-flex; align-items: center; gap: 10px; margin-top: 20px;
    }
    .btn-grad:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0, 114, 255, 0.6); }

    .main-grid { display: grid; grid-template-columns: 2.5fr 1fr; gap: 32px; }
    @media(max-width: 1000px) { .main-grid { grid-template-columns: 1fr; } }

    .canvas-container {
      position: relative;
      background: rgba(10, 10, 15, 0.4); 
      border-radius: 16px; aspect-ratio: 16/9; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center;
      cursor: grab;
    }

    .view-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    #zoomWrapper { width: 100%; height: 100%; position: relative; display: flex; align-items: center; justify-content: center; transform-origin: center center; }

    /* MARKERS - Moved to higher Z-index and relative to container */
    .marker {
      position: absolute; width: 32px; height: 32px;
      border-radius: 50%; background: var(--accent);
      border: 3px solid white;
      display: none; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.3s, background 0.5s; z-index: 100;
      color: white; font-weight: 800; font-size: 0.9rem;
      box-shadow: 0 5px 15px rgba(255, 0, 85, 0.6);
      transform: scale(0);
    }
    .marker.active { transform: scale(1.3); background: #fff; color: var(--accent); }
    .marker.mode-3d { background: var(--warning); box-shadow: 0 5px 15px rgba(251, 191, 36, 0.6); }

    .scan-line {
      position: absolute; top: 0; left: 0; width: 100%; height: 4px;
      background: linear-gradient(90deg, transparent, #00f2ff, transparent);
      box-shadow: 0 0 30px #00f2ff; z-index: 20; display: none; pointer-events: none;
    }
    .scanning .scan-line { display: block; animation: scanMove 1.2s infinite alternate ease-in-out; }
    @keyframes scanMove { 0% { top: 0%; } 100% { top: 100%; } }

    .zoom-controls { position: absolute; bottom: 20px; right: 20px; z-index: 50; display: flex; flex-direction: column; gap: 8px; }
    .zoom-btn { background: white; border: none; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; font-weight: 700; }

    .sidebar-title { font-size: 1.3rem; margin-bottom: 24px; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; }
    .info-row { display: flex; justify-content: space-between; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 5px; }
    
    .issue-card { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 16px; margin-bottom: 16px; cursor: pointer; transition: 0.2s; }
    .issue-card:hover { background: rgba(255,255,255,0.1); border-color: var(--primary); }
    .issue-card.highlighted { border: 1px solid var(--primary); background: rgba(0, 242, 255, 0.1); }

    .chat-section { margin-top: 24px; height: 300px; display: flex; flex-direction: column; }
    .chat-history { flex: 1; background: rgba(0,0,0,0.2); border-radius: 16px; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .chat-bubble { padding: 10px 15px; border-radius: 15px; max-width: 80%; font-size: 0.9rem; }
    .chat-bubble.bot { align-self: flex-start; background: rgba(255,255,255,0.1); }
    .chat-bubble.user { align-self: flex-end; background: var(--secondary); }

    .toggle-btn { background: rgba(255,255,255,0.1); border: none; padding: 10px 20px; border-radius: 10px; color: white; cursor: pointer; margin-right: 5px; }
    .toggle-btn.active { background: white; color: black; font-weight: 700; }
    .toggle-btn.disabled { opacity: 0.3; cursor: not-allowed; }

    .layer-controls { position: absolute; top: 20px; right: 20px; z-index: 20; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 50px; display: flex; }
    .layer-btn { background: transparent; border: none; color: white; padding: 5px 15px; border-radius: 50px; cursor: pointer; }
    .layer-btn.active { background: var(--primary); color: black; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; display: none; align-items: center; justify-content: center; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: #1e293b; padding: 30px; border-radius: 20px; text-align: center; max-width: 400px; }
  </style>
</head>
<body>

<div class="bg-container">
  <div class="bg-layer layer-right"></div>
  <div class="bg-layer layer-left"></div>
</div>

<div class="app">
  <header>
    <div class="logo"><div class="logo-icon">▲</div> ArcWiz AI</div>
  </header>

  <div class="glass-card">
    <h2>Upload Project Files</h2>
    <div class="upload-grid">
      <label class="file-input-wrapper">
        <input type="file" id="archInput" accept="image/*">
        <div class="upload-btn-visual"><span>📐 Upload Floor Plan</span><span id="archFileName" style="color:#4ade80"></span></div>
      </label>
      <label class="file-input-wrapper">
        <input type="file" id="mepInput" accept="image/*">
        <div class="upload-btn-visual"><span>⚡ Upload MEP Plan</span><span id="mepFileName" style="color:#4ade80"></span></div>
      </label>
    </div>
    <div style="text-align:center;"><button class="btn-grad" id="analyzeBtn">✨ Run Analysis</button></div>
  </div>

  <div class="main-grid">
    <div class="glass-card" style="display:flex; flex-direction:column; min-height:600px;">
      <div class="view-toggles">
         <button class="toggle-btn active" id="btn2D">Floor Plan</button>
         <button class="toggle-btn disabled" id="btn3D">3D Model</button>
      </div>

      <div class="canvas-container" id="mainCanvasContainer">
        <div id="layer2D" class="view-layer">
            <div class="zoom-controls">
                <button class="zoom-btn" id="zoomInBtn">+</button>
                <button class="zoom-btn" id="zoomOutBtn">-</button>
                <button class="zoom-btn" id="resetZoomBtn">R</button>
            </div>
            <div id="layerSwitcher" class="layer-controls" style="display:none;">
                <button id="showArchBtn" class="layer-btn active">Arch</button>
                <button id="showMepBtn" class="layer-btn">MEP</button>
            </div>
            <div class="scan-line"></div> 
            <div class="placeholder-text" style="opacity:0.5">Waiting for plan upload...</div>
            <div id="zoomWrapper">
                <img id="currentArchImg" style="display:none; width:100%; height:100%; object-fit:contain;">
                <img id="currentMepImg" style="display:none; width:100%; height:100%; object-fit:contain;">
            </div>
        </div>

        <div id="layer3D" class="view-layer" style="display:none;">
            <div id="image3DContainer" style="width:100%; height:100%;">
                <img src="3d model.jpg" style="width:100%; height:100%; object-fit:contain;" onerror="this.src='https://via.placeholder.com/800x600/1e293b/ffffff?text=3D+Model+Preview'">
            </div>
        </div>

        <div id="marker1" class="marker" style="top: 30%; left: 24%;" title="Clash Detected">1</div>
        <div id="marker2" class="marker" style="top: 37%; right: 33%;" title="Routing Error">2</div>
      </div>
      
      <div class="chat-section">
        <div class="chat-history" id="chatHistory">
           <div class="chat-bubble bot">Hello! Upload blueprints to start.</div>
        </div>
      </div>
    </div>

    <div class="glass-card">
      <div class="sidebar-title">Analysis Summary</div>
      <div class="info-row"><span>Area</span><span id="areaDisplay">--</span></div>
      <div class="info-row"><span>Rooms</span><span id="roomsDisplay">--</span></div>
      <div id="issuesList" style="display:none; margin-top:20px;">
          <div class="issue-card" data-target="marker1"><b>⚠️ Clash Detected</b><br><small>Kitchen Socket clearance</small></div>
          <div class="issue-card" data-target="marker2"><b>⚠️ Routing Issue</b><br><small>Bathroom wet zone</small></div>
      </div>
    </div>
  </div>
</div>

<div id="customModal" class="modal-overlay">
    <div class="modal-content">
        <h3 id="modalMessage"></h3>
        <button class="toggle-btn active" onclick="document.getElementById('customModal').classList.remove('active')">Understood</button>
    </div>
</div>

<script>
  let scale = 1, pointX = 0, pointY = 0, isDragging = false, startX, startY;
  const zoomWrapper = document.getElementById('zoomWrapper');
  const canvasContainer = document.getElementById('mainCanvasContainer');
  const markers = document.querySelectorAll('.marker');

  function updateTransform() {
      // Apply to image
      zoomWrapper.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
      
      // If we are in 2D mode, markers should follow the zoom/pan
      if(document.getElementById('layer2D').style.display !== 'none') {
          markers.forEach(m => {
              // We maintain the scale(1) or scale(1.3) from hover but add translation
              const isHovered = m.classList.contains('active') ? 1.3 : 1;
              m.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale * isHovered})`;
          });
      } else {
          // In 3D mode, markers stay static on the container
          markers.forEach(m => {
              const isHovered = m.classList.contains('active') ? 1.3 : 1;
              m.style.transform = `scale(${isHovered})`;
          });
      }
  }

  // Pan & Zoom Event Listeners
  canvasContainer.addEventListener('mousedown', (e) => {
      if (scale > 1 && document.getElementById('layer2D').style.display !== 'none') { 
          isDragging = true; startX = e.clientX - pointX; startY = e.clientY - pointY;
      }
  });
  window.addEventListener('mousemove', (e) => { if (isDragging) { pointX = e.clientX - startX; pointY = e.clientY - startY; updateTransform(); } });
  window.addEventListener('mouseup', () => isDragging = false);
  canvasContainer.addEventListener('wheel', (e) => {
      if(document.getElementById('layer2D').style.display === 'none') return;
      e.preventDefault();
      scale = Math.min(Math.max(1, scale + (-Math.sign(e.deltaY) * 0.1)), 5);
      if(scale === 1) { pointX = 0; pointY = 0; }
      updateTransform();
  });

  // Buttons Logic
  document.getElementById('zoomInBtn').addEventListener('click', () => { scale = Math.min(5, scale + 0.5); updateTransform(); });
  document.getElementById('zoomOutBtn').addEventListener('click', () => { scale = Math.max(1, scale - 0.5); updateTransform(); });
  document.getElementById('resetZoomBtn').addEventListener('click', () => { scale = 1; pointX = 0; pointY = 0; updateTransform(); });

  // View Switching
  const btn2D = document.getElementById('btn2D');
  const btn3D = document.getElementById('btn3D');
  const layer2D = document.getElementById('layer2D');
  const layer3D = document.getElementById('layer3D');

  btn2D.addEventListener('click', () => {
      btn2D.classList.add('active'); btn3D.classList.remove('active');
      layer2D.style.display = 'flex'; layer3D.style.display = 'none';
      markers.forEach(m => m.classList.remove('mode-3d'));
      updateTransform();
  });

  btn3D.addEventListener('click', () => {
      if(document.getElementById('archInput').files.length === 0) return alert("Upload Arch first");
      btn3D.classList.add('active'); btn2D.classList.remove('active');
      layer2D.style.display = 'none'; layer3D.style.display = 'flex';
      // Change markers look for 3D
      markers.forEach(m => m.classList.add('mode-3d'));
      updateTransform();
  });

  // Analysis Logic
  const analyzeBtn = document.getElementById('analyzeBtn');
  analyzeBtn.addEventListener('click', () => {
      if (document.getElementById('archInput').files.length === 0) return;
      layer2D.classList.add('scanning');
      analyzeBtn.innerText = "🧠 Analyzing...";
      
      setTimeout(() => {
          layer2D.classList.remove('scanning');
          analyzeBtn.innerText = "✨ Done";
          document.getElementById('issuesList').style.display = 'block';
          document.getElementById('areaDisplay').innerText = "88 sqm";
          document.getElementById('roomsDisplay').innerText = "3";
          
          // SHOW MARKERS IN BOTH
          markers.forEach(m => {
              m.style.display = 'flex';
              setTimeout(() => m.style.transform = "scale(1)", 50);
          });
      }, 3000);
  });

  // Upload Handlers
  function setupUpload(id, displayId, imgId) {
      document.getElementById(id).addEventListener('change', (e) => {
          const file = e.target.files[0];
          if(file) {
              document.getElementById(displayId).innerText = "✅ " + file.name;
              const reader = new FileReader();
              reader.onload = (ex) => {
                  document.querySelector('.placeholder-text').style.display = 'none';
                  document.getElementById('layerSwitcher').style.display = 'flex';
                  const img = document.getElementById(imgId);
                  img.src = ex.target.result; img.style.display = 'block';
                  btn3D.classList.remove('disabled');
              };
              reader.readAsDataURL(file);
          }
      });
  }
  setupUpload('archInput', 'archFileName', 'currentArchImg');
  setupUpload('mepInput', 'mepFileName', 'currentMepImg');

  // Hover markers
  document.querySelectorAll('.issue-card').forEach(card => {
      card.addEventListener('mouseenter', () => {
          const m = document.getElementById(card.getAttribute('data-target'));
          if(m) { m.classList.add('active'); updateTransform(); }
      });
      card.addEventListener('mouseleave', () => {
          const m = document.getElementById(card.getAttribute('data-target'));
          if(m) { m.classList.remove('active'); updateTransform(); }
      });
  });
</script>

</body>
</html>
