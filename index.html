<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ArcWiz AI – Next Gen Interface</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <style>
    :root {
      --glass-bg: rgba(30, 41, 59, 0.4); 
      --glass-border: rgba(255, 255, 255, 0.2);
      --glass-highlight: rgba(255, 255, 255, 0.05);
      --glass-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      
      --primary: #00f2ff;
      --secondary: #7000ff;
      --accent: #ff0055;
      
      --text-main: #ffffff;
      --text-muted: #cbd5e1;
    }

    body {
      margin: 0;
      background: #0f172a; 
      font-family: 'Outfit', sans-serif; 
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      font-size: 16px; 
    }

    .bg-container {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
    }
    .bg-layer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-size: cover; background-position: center;
      transition: clip-path 0.1s ease-out;
    }
    .layer-right {
      background-image: url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=2070&auto=format&fit=crop');
      z-index: 1;
    }
    .layer-right::after {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, rgba(255,0,100,0.6), rgba(255,100,0,0.6));
      mix-blend-mode: overlay;
    }
    .layer-left {
      background-image: url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=2070&auto=format&fit=crop');
      z-index: 2;
      clip-path: inset(0 50% 0 0);
      border-right: 1px solid rgba(255,255,255,0.4);
    }
    .layer-left::after {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, rgba(0,200,255,0.6), rgba(100,50,255,0.6));
      mix-blend-mode: overlay;
    }

    .app {
      max-width: 1300px; 
      margin: 0 auto;
      padding: 40px 24px;
      position: relative;
      z-index: 10;
    }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
    .logo {
      font-size: 2.2rem; font-weight: 800; color: white;
      display: flex; align-items: center; gap: 15px;
      text-shadow: 0 4px 20px rgba(0,242,255,0.3); letter-spacing: -0.5px;
    }
    .logo-icon {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      border-radius: 14px; display: flex; align-items: center; justify-content: center;
      color: white; font-size: 1.5rem; box-shadow: 0 0 20px rgba(0,114,255,0.4);
    }

    .glass-card {
      background: var(--glass-bg); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--glass-border); border-top: 1px solid rgba(255,255,255,0.4); 
      border-radius: 24px; padding: 32px; box-shadow: var(--glass-shadow); margin-bottom: 32px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .glass-card:hover { box-shadow: 0 30px 60px rgba(0,0,0,0.3); border-color: rgba(255,255,255,0.3); }

    h2 { margin-top: 0; font-size: 1.6rem; font-weight: 700; color: white; margin-bottom: 15px; }

    .upload-container {
      background: rgba(0,0,0,0.2); border: 2px dashed rgba(255,255,255,0.2);
      border-radius: 20px; padding: 40px; text-align: center; transition: 0.3s;
    }
    .upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 20px; }
    .file-input-wrapper { position: relative; cursor: pointer; height: 100%; }
    .file-input-wrapper input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 2; }
    .upload-btn-visual {
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1);
      padding: 25px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      color: white; font-weight: 600; font-size: 1.1rem; transition: 0.2s; min-height: 120px;
    }
    .file-name-display { font-size: 0.9rem; color: #4ade80; font-weight: 500; min-height: 1.2em; }

    .btn-grad {
      background-image: linear-gradient(to right, #00c6ff 0%, #0072ff 100%);
      padding: 16px 50px; border-radius: 50px; border: none;
      font-weight: 700; font-size: 1.1rem; color: white; cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4); transition: 0.3s;
      letter-spacing: 0.5px; display: inline-flex; align-items: center; gap: 10px; min-width: 220px; justify-content: center;
    }

    .main-grid { display: grid; grid-template-columns: 2.5fr 1fr; gap: 32px; }
    @media(max-width: 1000px) { .main-grid { grid-template-columns: 1fr; } }

    .canvas-container {
      position: relative;
      background: rgba(10, 10, 15, 0.4); 
      border-radius: 16px; aspect-ratio: 16/9; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.15); display: flex; align-items: center; justify-content: center;
      cursor: grab; 
    }

    #zoomWrapper {
      width: 100%; height: 100%;
      position: absolute; top: 0; left: 0;
      transform-origin: center center;
      transition: transform 0.1s linear; 
      display: flex; align-items: center; justify-content: center;
    }

    #zoomWrapper img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }

    .marker {
      position: absolute; width: 32px; height: 32px;
      border-radius: 50%; background: #ff0055;
      border: 3px solid white;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.3s; z-index: 10;
      color: white; font-weight: 800; font-size: 0.9rem;
      box-shadow: 0 5px 15px rgba(255, 0, 85, 0.6);
      transform: scale(0); display: none;
    }
    
    .scan-line {
      position: absolute; top: 0; left: 0; width: 100%; height: 4px;
      background: linear-gradient(90deg, transparent, #00f2ff, transparent);
      box-shadow: 0 0 30px #00f2ff, 0 0 10px white;
      z-index: 20; display: none; opacity: 0.9; pointer-events: none;
    }
    
    .scanning .scan-line { display: block; animation: scanMove 1.2s infinite alternate ease-in-out; }
    
    @keyframes scanMove { 0% { top: 0%; opacity: 0.5; } 100% { top: 100%; opacity: 0.5; } }

    .zoom-controls { position: absolute; bottom: 20px; right: 20px; z-index: 50; display: flex; flex-direction: column; gap: 8px; }
    .zoom-btn { background: rgba(255,255,255,0.9); border: none; width: 40px; height: 40px; border-radius: 12px; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    .chat-section { margin-top: 24px; display: flex; flex-direction: column; gap: 12px; height: 350px; }
    .chat-history { flex: 1; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
    .chat-bubble { max-width: 85%; padding: 14px 18px; border-radius: 18px; line-height: 1.5; font-size: 1rem; }
    .chat-bubble.bot { align-self: flex-start; background: rgba(255,255,255,0.15); color: white; border-bottom-left-radius: 4px; }
    .chat-bubble.user { align-self: flex-end; background: linear-gradient(135deg, #7000ff, #ae00ff); color: white; border-bottom-right-radius: 4px; }

    .questions-container { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; scrollbar-width: none; }
    .question-chip { white-space: nowrap; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 10px 20px; border-radius: 50px; font-size: 0.9rem; cursor: pointer; }

    .info-row { display: flex; justify-content: space-between; margin-bottom: 18px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .info-label { font-size: 0.95rem; color: rgba(255,255,255,0.7); }
    .info-val { font-weight: 600; color: white; }

    .issue-card { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
    .issue-link { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.1); color: var(--primary); padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; text-decoration: none; border: 1px solid rgba(0,242,255,0.3); }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px); z-index: 9999; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    .modal-overlay.active { opacity: 1; pointer-events: all; }
    .modal-content { background: rgba(20, 25, 40, 0.95); padding: 40px; border-radius: 24px; width: 360px; text-align: center; color: white; }
  </style>
</head>
<body>

<div class="bg-container">
  <div class="bg-layer layer-right"></div>
  <div class="bg-layer layer-left"></div>
</div>

<div class="app">
  <header>
    <div class="logo"><div class="logo-icon">▲</div>ArcWiz AI</div>
  </header>

  <div class="glass-card">
    <h2>Upload Project Files</h2>
    <div class="upload-container">
      <div class="upload-grid">
        <label class="file-input-wrapper">
          <input type="file" id="archInput" accept="image/*">
          <div class="upload-btn-visual"><span>📐 Upload Floor Plan</span><span id="archFileName" class="file-name-display"></span></div>
        </label>
        <label class="file-input-wrapper">
          <input type="file" id="mepInput" accept="image/*">
          <div class="upload-btn-visual"><span>⚡ Upload MEP Plan</span><span id="mepFileName" class="file-name-display"></span></div>
        </label>
      </div>
    </div>
    <div style="text-align:center; margin-top:20px;"><button class="btn-grad" id="analyzeBtn">✨ Run Analysis</button></div>
  </div>

  <div class="main-grid">
    <div class="glass-card" style="display:flex; flex-direction:column; min-height:650px;">
      <div class="canvas-container" id="mainCanvasContainer" style="flex:1;">
        <div id="layer2D" style="width:100%; height:100%; position:relative;">
          <div class="zoom-controls">
            <button class="zoom-btn" id="zoomInBtn">+</button>
            <button class="zoom-btn" id="zoomOutBtn">-</button>
          </div>
          <div class="scan-line"></div>
          <div id="zoomWrapper">
            <img id="currentArchImg" style="display:none; width:100%; height:100%; object-fit:contain;">
            <img id="currentMepImg" style="display:none; width:100%; height:100%; object-fit:contain;">
            <div id="marker1" class="marker" style="top: 30%; left: 24%;">1</div>
          </div>
        </div>
      </div>
      <div class="chat-section">
        <div class="chat-history" id="chatHistory"><div class="chat-bubble bot">Hello! Upload blueprints to start.</div></div>
        <div class="questions-container">
          <button class="question-chip" onclick="askQuestion(0)">Building area?</button>
          <button class="question-chip" onclick="askQuestion(4)">Export PDF</button>
        </div>
      </div>
    </div>

    <div class="glass-card">
      <div class="sidebar-title">Analysis Summary <span class="badge-ai" id="aiStatus" style="display:none;">DONE</span></div>
      <div class="info-row"><span class="info-label">Building Area</span><span class="info-val" id="areaDisplay">--</span></div>
      <div class="info-row"><span class="info-label">Rooms</span><span class="info-val" id="roomsDisplay">--</span></div>
      <div id="issuesList" style="display:none; margin-top:20px;">
        <div class="issue-card">
          <div style="color:#ef4444; font-weight:700;">⚠️ Clash Detected</div>
          <p style="font-size:0.9rem;">Kitchen: Socket clearance error.</p>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="customModal" class="modal-overlay">
  <div class="modal-content"><div id="modalMessage"></div><button onclick="document.getElementById('customModal').classList.remove('active')" style="margin-top:20px;">Close</button></div>
</div>

<script>
  let scale = 1, pointX = 0, pointY = 0;
  const zoomWrapper = document.getElementById('zoomWrapper');
  
  function updateTransform() { zoomWrapper.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`; }
  document.getElementById('zoomInBtn').onclick = () => { scale = Math.min(5, scale + 0.5); updateTransform(); };
  document.getElementById('zoomOutBtn').onclick = () => { scale = Math.max(1, scale - 0.5); updateTransform(); };

  function addBubble(text, type) {
    const b = document.createElement('div');
    b.className = `chat-bubble ${type}`;
    b.innerHTML = text;
    document.getElementById('chatHistory').appendChild(b);
  }

  function generatePDF() {
    // שלב 1: גלילה לראש העמוד למניעת היסט (Offset) ב-html2canvas
    window.scrollTo(0, 0);

    const element = document.createElement('div');
    // שלב 2: הסרת פדינג עליון לחלוטין באלמנט המקור
    element.style.padding = '0px 40px 40px 40px'; 
    element.style.backgroundColor = '#fff';
    element.style.color = '#000';
    element.style.fontFamily = 'Arial, sans-serif';

    element.innerHTML = `
      <h1 style="text-align: center; margin: 0; padding: 20px 0; font-size: 24px;">ArcWiz AI Analysis Report</h1>
      <h2 style="border-bottom: 2px solid #0072ff; padding-bottom: 5px;">Project Summary</h2>
      <p><strong>Building Area:</strong> ${document.getElementById('areaDisplay').innerText}</p>
      <p><strong>Rooms:</strong> ${document.getElementById('roomsDisplay').innerText}</p>
      <h2 style="color: #ef4444; border-bottom: 2px solid #ef4444; margin-top: 20px;">Issues Found</h2>
      <div style="background: #fff5f5; padding: 15px; border-radius: 8px;">
        <h3>⚠️ Clash Detected</h3>
        <p>Location: Kitchen | Issue: Socket violates minimum clearance (60cm).</p>
      </div>
    `;

    const opt = {
      // שלב 3: הגדרת שוליים עליונים של 0 מוחלט ב-PDF
      margin: [0, 10, 10, 10], 
      filename: 'ArcWiz_Report.pdf',
      image: { type: 'jpeg', quality: 0.98 },
      // שלב 4: הגדרת scrollY: 0 למניעת חיתוך אם הדף גלול
      html2canvas: { scale: 2, useCORS: true, scrollY: 0 }, 
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    html2pdf().set(opt).from(element).save();
    setTimeout(() => addBubble("✅ PDF generated without gaps.", 'bot'), 1000);
  }

  function askQuestion(i) {
    if(i === 4) generatePDF();
    else { addBubble("Building area?", 'user'); setTimeout(() => addBubble("Area is **~88 sqm**.", 'bot'), 500); }
  }

  document.getElementById('analyzeBtn').onclick = () => {
    const arch = document.getElementById('archInput').files[0];
    if(!arch) return;
    document.getElementById('layer2D').classList.add('scanning');
    setTimeout(() => {
      document.getElementById('layer2D').classList.remove('scanning');
      document.getElementById('areaDisplay').innerText = "~88 sqm";
      document.getElementById('roomsDisplay').innerText = "3";
      document.getElementById('issuesList').style.display = 'block';
      document.getElementById('marker1').style.display = 'flex';
      document.getElementById('marker1').style.transform = 'scale(1)';
      addBubble("Analysis complete.", 'bot');
    }, 2000);
  };

  document.getElementById('archInput').onchange = (e) => {
    const f = e.target.files[0];
    if(f) {
      document.getElementById('archFileName').innerText = "✅ " + f.name;
      const r = new FileReader();
      r.onload = (ev) => { 
        document.getElementById('currentArchImg').src = ev.target.result;
        document.getElementById('currentArchImg').style.display = 'block';
      };
      r.readAsDataURL(f);
    }
  };
</script>
</body>
</html>
